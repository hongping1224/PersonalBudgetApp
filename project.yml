name: BudgetApp
options:
  bundleIdPrefix: com.hongping
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hant
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  BudgetApp:
    type: application
    platform: iOS
    sources:
      - BudgetApp
      - Shared
    dependencies:
      - target: BudgetWidget
    info:
      path: BudgetApp/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Widget buttons open budgetapp://add?kind=…&category=….
        CFBundleURLTypes:
          - CFBundleURLName: com.hongping.budgetapp
            CFBundleURLSchemes: [budgetapp]
    entitlements:
      path: BudgetApp/BudgetApp.entitlements
      properties:
        com.apple.security.application-groups: [group.com.hongping.budgetapp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hongping.budgetapp
        PRODUCT_NAME: BudgetApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 記帳本
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportsDocumentBrowser: NO
        # Show the app's Documents folder in Files (On My iPhone → 記帳本) for backups.
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  BudgetWidget:
    type: app-extension
    platform: iOS
    sources:
      - BudgetWidget
      - Shared
      - BudgetApp/Support/Formatting.swift
    info:
      path: BudgetWidget/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: BudgetWidget/BudgetWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.hongping.budgetapp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hongping.budgetapp.widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 記帳本
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  BudgetAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BudgetAppTests]
    dependencies:
      - target: BudgetApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.hongping.budgetapp.tests
  BudgetAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [BudgetAppUITests]
    dependencies:
      - target: BudgetApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.hongping.budgetapp.uitests
        TEST_TARGET_NAME: BudgetApp
schemes:
  BudgetApp:
    build:
      targets:
        BudgetApp: all
    test:
      targets:
        - BudgetAppTests
        - BudgetAppUITests
